[package]
name = "aar-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
sha2 = "0.10.9"
walkdir = "2.5.0"
colored = "3.0.0"

[profile.release]
lto = true
codegen-units = 1
strip = true